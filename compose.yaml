name: cce-foundation
services:
  moderation-worker:
    profiles: [moderation-worker]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ["/app/services/backend/.venv/bin/cce-moderation-worker"]
    environment:
      CCE_ENVIRONMENT: ${CCE_ENVIRONMENT:-}
      CCE_WORKER_DATABASE_URL: ${CCE_WORKER_DATABASE_URL:-}
      CCE_STORAGE_URL: ${CCE_STORAGE_URL:-}
      CCE_SUPABASE_PUBLISHABLE_KEY: ${CCE_SUPABASE_PUBLISHABLE_KEY:-}
      CCE_MODERATION_AUTH_USER_ID: ${CCE_MODERATION_AUTH_USER_ID:-}
      CCE_MODERATION_AUTH_EMAIL: ${CCE_MODERATION_AUTH_EMAIL:-}
      CCE_MODERATION_AUTH_PASSWORD: ${CCE_MODERATION_AUTH_PASSWORD:-}
      CCE_MODERATION_SCANNER_FACTORY: ${CCE_MODERATION_SCANNER_FACTORY:-}
      CCE_MODERATION_IDLE_SECONDS: ${CCE_MODERATION_IDLE_SECONDS:-2}
      CCE_MODERATION_STARTUP_SECONDS: ${CCE_MODERATION_STARTUP_SECONDS:-120}
      CCE_MODERATION_TIMEOUT_SECONDS: ${CCE_MODERATION_TIMEOUT_SECONDS:-120}
      PYTHONDONTWRITEBYTECODE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    restart: "on-failure:3"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      CCE_ENVIRONMENT: local
      CCE_DATABASE_URL: postgresql+psycopg://cce_api:cce-local-api-only@host.docker.internal:54322/postgres
      CCE_ENGINE_DATABASE_URL: postgresql+psycopg://cce_engine:cce-local-engine-only@host.docker.internal:54322/postgres
      CCE_AUTH_ISSUER: http://127.0.0.1:54321/auth/v1
      CCE_AUTH_JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      CCE_STORAGE_URL: http://host.docker.internal:54321
      CCE_SUPABASE_PUBLISHABLE_KEY: ${CCE_SUPABASE_PUBLISHABLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      CCE_API_BASE_URL: http://api:8000
      CCE_SUPABASE_URL: http://host.docker.internal:54321
      CCE_SUPABASE_PUBLISHABLE_KEY: ${CCE_SUPABASE_PUBLISHABLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      api:
        condition: service_healthy
