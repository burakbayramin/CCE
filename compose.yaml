name: cce-foundation
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      CCE_ENVIRONMENT: local
      CCE_DATABASE_URL: postgresql+psycopg://cce_api:cce-local-api-only@host.docker.internal:54322/postgres
      CCE_ENGINE_DATABASE_URL: postgresql+psycopg://cce_engine:cce-local-engine-only@host.docker.internal:54322/postgres
      CCE_AUTH_ISSUER: http://127.0.0.1:54321/auth/v1
      CCE_AUTH_JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      CCE_STORAGE_URL: http://host.docker.internal:54321
      CCE_SUPABASE_PUBLISHABLE_KEY: ${CCE_SUPABASE_PUBLISHABLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      CCE_API_BASE_URL: http://api:8000
      CCE_SUPABASE_URL: http://host.docker.internal:54321
      CCE_SUPABASE_PUBLISHABLE_KEY: ${CCE_SUPABASE_PUBLISHABLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      api:
        condition: service_healthy
