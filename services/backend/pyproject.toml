[project]
name = "cce-backend"
version = "0.1.0"
description = "Cognitive Character Engine control plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
]

[project.scripts]
cce-moderation-worker = "cce.modules.contributions.moderation_service:cli"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cce"]

[tool.uv]
required-version = "==0.10.3"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the isolated local Supabase stack"]
