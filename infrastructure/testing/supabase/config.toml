# Separate local stack: never reset the development database containing real accounts.
project_id = "cce-integration"
[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
auto_expose_new_tables = false
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.seed]
enabled = false
[db.pooler]
enabled = false
port = 55329
[studio]
enabled = false
port = 55323
[local_smtp]
enabled = true
port = 55324
[auth]
enabled = true
site_url = "http://127.0.0.1:3101"
additional_redirect_urls = ["http://127.0.0.1:3101/auth/callback"]
minimum_password_length = 12
[auth.email]
enable_confirmations = false
[auth.rate_limit]
sign_in_sign_ups = 300
[storage]
enabled = true
[analytics]
enabled = false
[edge_runtime]
enabled = false
